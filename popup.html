<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Arca</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32x32.png" alt="" />
      <div>
        <strong>Arca</strong>
        <span id="site"></span>
      </div>
    </header>
    <main id="logins">
      <p class="note">Conectando con Arca…</p>
    </main>
    <section class="generator">
      <p class="label" id="generator-label"></p>
      <div class="generated">
        <code id="password"></code>
        <button id="regenerate" class="icon"></button>
        <button id="copy-generated" class="icon"></button>
      </div>
    </section>
    <a id="privacy" class="privacy" href="https://github.com/gbaldessari/arca-extension/blob/main/PRIVACY.md" target="_blank" rel="noopener"></a>
    <script src="icons.js"></script>
    <script src="i18n.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
